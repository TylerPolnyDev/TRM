<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Travel Research Map</title>
    <link href="./src/main.css" rel="stylesheet" />
</head>
<body>
    <!-- Auth Overlay-->
    <div id="auth-container">
        <div class="auth-card">
            <h2>Travel Research Map - Sign In</h2>
            <form id="auth-form">
                <input type="email" id="email" placeholder="Email" required/>
                <input type="password" id="password" placeholder="Password" required/>
                <input type="text" id="confirmation-code" placeholder="Enter 6-digit code" style="display: none;"/>
                <button type="submit" id="signin-btn">Sign In</button>
                <button type="button" id="signup-btn">Create Account</button>
                <button type="button" id="confirm-btn" style="display: none;">Confirm Account</button>
            </form>
            <p id="auth-message"></p>
            <p id="return-message" style="display: none;">Not getting your code?: </p><button type="button" id="return-to-signin" style="display: none;">Click Here</button>

        </div>
    </div>

    <!-- Main App -->
    <div id="app-container" style="display: none;">
        <header>
            <h1>Travel Research Map</h1>
            <button id="logout-btn">Sign Out</button>
        </header>
        <main>
            <div id="map"></div>
            <script type="module" src="./src/main.js"></script>
            <aside>
                <h2>Area Insights</h2>
                <div id="area-insights">
                    <p class="placeholder-text">Click the map to see details...</p>

                    <section class="insight-card" aria-labelledby="weather-heading">
                        <h3 id="weather-heading">Weather</h3>
                        <p id="weather-content">--</p>
                    </section>

                    <section class="insight-card" aria-labelledby="gas-heading">
                        <h3 id="gas-heading">Average Gas Prices</h3>
                        <p id="gas-content">--</p>
                    </section>

                    <section class="insight-card" aria-labelledby="crime-heading">
                        <h3 id="crime-heading">Crime Rate</h3>
                        <p id="crime-content">--</p>
                    </section>

                </div>
            </aside>
        </main>
        <footer>Authenticated Amazon Location Service App</footer>
    </div>
</body>
</html>
